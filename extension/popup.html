<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode Revision</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>LeetCode Revise</h1>
      <span id="due-count" class="badge">0</span>
    </header>

    <div class="tabs">
      <button id="tab-due" class="tab active">Time to Revise</button>
      <button id="tab-upcoming" class="tab">Upcoming</button>
    </div>
    
    <div id="problem-list" class="problem-list">
      <!-- Problems will be injected here -->
      <div class="empty-state">Loading...</div>
    </div>

    <footer>
      <p>Keep the streak alive! 🔥</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
